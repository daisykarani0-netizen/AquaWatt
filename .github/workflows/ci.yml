
name: AquaWatt CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile AquaWatt
        run: gcc -Wall -Wextra aquawatt.c -o aquawatt -lm

      - name: Run automated tests
        run: bash test.sh
